[package]
name = "storyforge-studio"
version = "0.1.0"
description = "StoryForge Studio Desktop Shell"
edition = "2021"

[lib]
name = "storyforge_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
